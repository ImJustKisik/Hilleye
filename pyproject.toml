[project]
name = "hilleye"
version = "1.0.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.12.5",
    "python-multipart==0.0.21",
    "pillow==13.0.0; python_version >= '3.11'",
    "pillow==12.3.0; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "psutil==7.2.2"]

[tool.uv]
package = false
