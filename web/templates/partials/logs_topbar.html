<div class="logs-topbar">
  <div class="logs-topbar-left">
    <nav class="logs-subnav" aria-label="Навигация по логам">
      <a href="/logs" class="logs-nav-pill {% if logs_nav_active == 'rounds' %}is-active{% endif %}">Раунды</a>
      <a href="/logs/search{% if logs_round_search_uid %}?round_uid={{ logs_round_search_uid|urlencode }}{% endif %}"
         class="logs-nav-pill {% if logs_nav_active == 'search' %}is-active{% endif %}">{% if logs_round_search_uid %}Поиск в раунде{% else %}Поиск{% endif %}</a>
      {% if user.is_admin %}
      <a href="/logs/admin" class="logs-nav-pill {% if logs_nav_active == 'admin' %}is-active{% endif %}">Доступ и аудит</a>
      {% endif %}
    </nav>
  </div>
  <div class="logs-topbar-right">
    {% if logs_show_refresh %}
    <form action="/logs/refresh" method="post">
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <button type="submit" class="logs-btn logs-btn-sm" title="Проверить новые раунды на диске">Обновить</button>
    </form>
    {% endif %}
    <span class="logs-user-meta">
      <span>{{ user.display_name }}</span>
      <span class="logs-user-role">({{ user.role }})</span>
    </span>
    <form action="/auth/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <button type="submit" class="logs-btn logs-btn-sm">Выйти</button>
    </form>
  </div>
</div>

<div id="logs-boot-overlay" class="logs-boot-overlay" hidden aria-hidden="true">
  <div class="logs-boot-card">
    <div class="logs-boot-brand">
      <img src="/static/img/logo.svg" alt="" width="30" height="30" class="logs-boot-logo">
      <span class="logs-boot-title mono-val">HILLEYE // LOGS</span>
    </div>
    <div class="logs-boot-status mono-val">
      <span class="status-dot online" aria-hidden="true"></span>
      <span>{{ user.display_name }}</span>
      <span class="logs-user-role">({{ user.role }})</span>
    </div>
    <div class="logs-boot-track" aria-hidden="true">
      <div class="logs-boot-bar"></div>
    </div>
  </div>
</div>
