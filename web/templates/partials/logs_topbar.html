<div class="logs-topbar">
  <div class="logs-topbar-left">
    <nav class="logs-subnav" aria-label="Навигация по логам">
      <a href="/logs" class="logs-nav-pill {% if logs_nav_active == 'rounds' %}is-active{% endif %}">
        <svg class="logs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span>Раунды</span>
      </a>
      <a href="/logs/search{% if logs_round_search_uid %}?round_uid={{ logs_round_search_uid|urlencode }}{% endif %}"
         class="logs-nav-pill {% if logs_nav_active == 'search' %}is-active{% endif %}">
        <svg class="logs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>{% if logs_round_search_uid %}Поиск в раунде{% else %}Поиск{% endif %}</span>
      </a>
      <a href="/logs/celadon" class="logs-nav-pill {% if logs_nav_active == 'celadon' %}is-active{% endif %}">
        <span>Логи Celadon</span>
      </a>
      {% if user.is_admin %}
      <a href="/logs/admin" class="logs-nav-pill {% if logs_nav_active == 'admin' %}is-active{% endif %}">
        <svg class="logs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Доступ и аудит</span>
      </a>
      {% endif %}
    </nav>
  </div>
  <div class="logs-topbar-right">
    {% if logs_show_refresh %}
    <form action="/logs/refresh" method="post" class="logs-inline-form">
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <button type="submit" class="logs-btn logs-btn-sm" title="Проверить новые раунды на диске">
        <svg class="logs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>Обновить</span>
      </button>
    </form>
    {% endif %}
    <span class="logs-user-meta">
      <span class="logs-user-name">{{ user.display_name }}</span>
      <span class="logs-user-role">{{ user.role }}</span>
    </span>
    <form action="/auth/logout" method="post" class="logs-inline-form">
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <button type="submit" class="logs-btn logs-btn-sm">Выйти</button>
    </form>
  </div>
</div>

<div id="logs-index-status" class="logs-alert logs-alert-info" role="status"
     aria-live="polite" data-user-id="{{ user.discord_id }}" hidden></div>
<div id="logs-job-status" class="logs-alert logs-alert-info" role="status" aria-live="polite" hidden></div>

<div id="logs-boot-overlay" class="logs-boot-overlay" hidden aria-hidden="true">
  <div class="logs-boot-card">
    <div class="logs-boot-brand">
      <img src="/static/img/logo.svg" alt="" width="30" height="30" class="logs-boot-logo">
      <span class="logs-boot-title mono-val">HILLEYE // LOGS</span>
    </div>
    <div class="logs-boot-status mono-val">
      <span class="status-dot online" aria-hidden="true"></span>
      <span>{{ user.display_name }}</span>
      <span class="logs-user-role">({{ user.role }})</span>
    </div>
    <div class="logs-boot-track" aria-hidden="true">
      <div class="logs-boot-bar"></div>
    </div>
  </div>
</div>
