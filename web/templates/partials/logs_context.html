<div class="logs-panel-body">
  <div class="logs-context-bar">
    <span class="mono-val">Строки вокруг <strong>#L{{ target_line }}</strong> (&plusmn;{{ radius }}, все категории)</span>
    <a href="/logs/round/{{ round.round_uid }}?file={{ selected_file|urlencode }}&preset=all&focus={{ target_line }}#L{{ target_line }}" class="logs-btn logs-btn-sm logs-btn-primary">Открыть в раунде (Все категории)</a>
  </div>
  <div class="log-stream">
    {% for r in rows %}
    <div class="log-row {% if r.is_target %}is-target{% endif %}">
      <span class="log-ln">#L{{ r.line_no }}</span>
      <span class="log-ts">{{ r.time_short or r.timestamp }}</span>
      <span><span class="log-cat-tag {{ r.cat_css }}">{{ r.category }}</span></span>
      <div class="log-msg-cell">{{ r.safe_html | safe }}</div>
      <span></span>
    </div>
    {% endfor %}
  </div>
</div>
