<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Precision Hardware Telemetry Frame -->
  <rect x="2" y="2" width="60" height="60" rx="2" fill="#0e1116" stroke="#2c3342" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" fill="#080a0d" stroke="#1e232d" stroke-width="1"/>

  <!-- Corner Calibration Marks -->
  <path d="M10 16V10H16" stroke="#8592a6" stroke-width="1.5"/>
  <path d="M54 16V10H48" stroke="#8592a6" stroke-width="1.5"/>
  <path d="M10 48V54H16" stroke="#8592a6" stroke-width="1.5"/>
  <path d="M54 48V54H48" stroke="#8592a6" stroke-width="1.5"/>

  <!-- Axis Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#525d70" stroke-width="1.5"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#525d70" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="#525d70" stroke-width="1.5"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#525d70" stroke-width="1.5"/>

  <!-- Geometric Aperture / Telemetry Eye -->
  <polygon points="12,32 24,20 40,20 52,32 40,44 24,44" fill="#13171f" stroke="#d92638" stroke-width="2"/>

  <!-- Inner Reticle Ring -->
  <circle cx="32" cy="32" r="7" fill="#080a0d" stroke="#edeff2" stroke-width="1.5"/>

  <!-- Active Signal Lock Core -->
  <rect x="29.5" y="29.5" width="5" height="5" fill="#d92638"/>
</svg>
